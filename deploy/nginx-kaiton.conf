# ==============================================================================
# Конфигурация Nginx для МедиаКод (Ubuntu Server 24.04 LTS)
# Шаблон автоматически адаптируется установщиком deploy/install.sh под домены
# и настраивается Certbot для автоматического HTTP -> HTTPS редиректа.
# ==============================================================================

# 1. PRODUCTION: kaiton.ru -> 127.0.0.1:4000
server {
    listen 80;
    listen [::]:80;
    server_name kaiton.ru www.kaiton.ru;

    # Разрешаем загрузку медиаматериалов до 55 МБ (лимит приложения 50 МБ)
    client_max_body_size 55M;
    server_tokens off;

    # Базовые заголовки безопасности на уровне reverse proxy
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}

# 2. STAGING: stage.kaiton.ru -> 127.0.0.1:4001
server {
    listen 80;
    listen [::]:80;
    server_name stage.kaiton.ru;

    client_max_body_size 55M;
    server_tokens off;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    location / {
        proxy_pass http://127.0.0.1:4001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
